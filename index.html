<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bucket File Browser</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
        h1 { color: #333; }
        .breadcrumb { margin-bottom: 1rem; font-size: 1.1rem; }
        .breadcrumb a { text-decoration: none; color: #0066cc; }
        .breadcrumb a:hover { text-decoration: underline; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ddd; }
        tr:hover { background-color: #f5f5f5; }
        .folder-link { cursor: pointer; color: #0066cc; font-weight: bold; text-decoration: none; }
        .download-btn { cursor: pointer; color: #0066cc; text-decoration: underline; background: none; border: none; padding: 0; font: inherit; }
        .loading { font-style: italic; color: #666; }
        .error { color: #cc0000; font-weight: bold; }
        .size { color: #666; font-size: 0.9rem; }
        .icon { margin-right: 8px; }
        .set-tag-btn {
            cursor: pointer;
            color: #4caf50;
            background: none;
            border: 1px solid #4caf50;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-left: 8px;
        }
        .set-tag-btn:hover { background: #e8f5e9; }
        .tag {
            display: inline-flex;
            align-items: center;
            background: #e1f5fe;
            color: #01579b;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            margin-right: 4px;
        }
        .remove-tag-btn {
            cursor: pointer;
            margin-left: 6px;
            color: #d32f2f;
            font-weight: bold;
            border: none;
            background: none;
            padding: 0;
            font-size: 1.1rem;
            line-height: 1;
        }
        .remove-tag-btn:disabled {
            color: #9e9e9e;
            cursor: not-allowed;
        }
        .sortable {
            cursor: pointer;
            user-select: none;
        }
        .sortable:hover {
            background-color: #eee;
        }
        .sort-icon {
            font-size: 0.8rem;
            margin-left: 4px;
        }
        .upload-section {
            background: #f9f9f9;
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 1.5rem;
        }
        .filter-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }
        .filter-controls input {
            padding: 4px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .filter-controls button {
            background: #8bc34a;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .filter-controls button:hover { background: #7cb342; }
        .upload-section input[type="file"] { margin-bottom: 10px; }
        .upload-section button {
            background: #4caf50;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        .upload-section button:hover { background: #45a049; }
        .upload-section button:disabled { background: #ccc; cursor: not-allowed; }

        .filter-section {
            background: #f1f8e9;
            padding: 1rem;
            border: 1px solid #c5e1a5;
            border-radius: 4px;
            margin-bottom: 1.5rem;
        }
        .filter-chip {
            display: inline-flex;
            align-items: center;
            background: #fff;
            border: 1px solid #8bc34a;
            color: #33691e;
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 0.9rem;
            margin: 4px;
            cursor: default;
        }
        .remove-filter-btn {
            cursor: pointer;
            margin-left: 8px;
            color: #7cb342;
            font-weight: bold;
            border: none;
            background: none;
            padding: 0;
            font-size: 1rem;
        }
        .filter-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        .filter-header h3 { margin: 0; }
        .clickable-tag { cursor: pointer; border: 1px solid transparent; transition: border 0.2s; }
        .clickable-tag:hover { border-color: #0288d1; }
        .refresh-container { position: fixed; top: 16px; left: 16px; z-index: 900; }
        #pagination { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 12px; margin: 24px 0; }
        #page-label { flex-basis: 100%; text-align: center; color: #666; }
        #page-numbers { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; }
        #pagination button { background: transparent; color: #1a73e8; border: 0; padding: 8px 10px; cursor: pointer; font: inherit; border-radius: 4px; }
        #pagination button:hover:not(:disabled) { background: #eef4ff; text-decoration: underline; }
        #pagination button[aria-current="page"] { color: #202124; font-weight: bold; background: #eef1f4; }
        #pagination button:disabled:not([aria-current="page"]) { color: #aaa; cursor: default; }
        #pagination button:focus-visible { outline: 2px solid #1a73e8; outline-offset: 2px; }
        .yin-yang-btn {
            width: 72px; height: 72px; padding: 0; border-radius: 50%;
            border: 2px solid #3e6b21; background: #f5faee; color: #263d17;
            position: relative; cursor: pointer; box-shadow: 0 3px 10px #0002;
        }
        .yin-yang-btn svg { width: 64px; height: 64px; display: block; margin: auto; }
        .yin-yang-btn:disabled { cursor: default; }
        .yin-yang-btn[data-state="cooldown"] svg { opacity: .35; }
        .refresh-spinner { display: block; width: 64px; height: 64px; margin: auto;
            transform-origin: 50% 50%; }
        .yin-yang-btn[data-state="loading"] .refresh-spinner {
            animation: refresh-spin 1.5s linear infinite; will-change: transform; }
        .yin-yang-btn[data-state="error"] { border-color: #b42318; }
        .yin-yang-btn:focus-visible { outline: 3px solid #0066cc; outline-offset: 3px; }
        .timer-display { position: absolute; inset: 0; display: grid; place-items: center;
            font: bold 18px sans-serif; pointer-events: none; }
        @keyframes refresh-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @media (max-width: 1150px) { body { padding-top: 64px; } }
        @media (prefers-reduced-motion: reduce) {
            .yin-yang-btn[data-state="loading"] .refresh-spinner { animation: none; }
        }
        .signjs-health { position: fixed; right: 16px; top: 16px; z-index: 1001;
            max-width: 250px; padding: 8px; border: 1px solid #999; border-radius: 12px;
            background: #eee; color: #555; font: 12px sans-serif; }
        .signjs-health-icon { display: inline-grid; place-items: center; width: 48px;
            height: 48px; border-radius: 50%; background: #ccc; font-size: 28px; }
        .signjs-health[hidden] { display: none; }
        .signjs-widget-frame[data-health="loading"], .signjs-widget-frame[data-health="error"] { visibility: hidden; }
        .signjs-widget-frame {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1000;
            width: 72px;
            height: 72px;
            border: 0;
            border-radius: 50%;
            background: transparent;
            transition: width 0.2s ease, height 0.2s ease, border-radius 0.2s ease, box-shadow 0.2s ease;
        }
        .signjs-widget-frame[data-compact="false"] {
            border-radius: 12px;
            background: #f0f2f5;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.2);
        }
        @media (prefers-reduced-motion: reduce) {
            .signjs-widget-frame { transition: none; }
        }
    </style>
</head>
<body>
    <div class="refresh-container">
        <button id="refresh-btn" class="yin-yang-btn" type="button" onclick="manualRefresh()"
            title="Обновить список файлов" aria-label="Обновить список файлов" data-state="ready">
            <span class="refresh-spinner"><svg viewBox="0 0 100 100" aria-hidden="true">
                <circle cx="50" cy="50" r="46" fill="#a2d149"/>
                <path d="M50 4 A46 46 0 0 1 50 96 A23 23 0 0 1 50 50 A23 23 0 0 0 50 4" fill="#3e6b21"/>
                <circle cx="50" cy="27" r="7" fill="#3e6b21"/>
                <circle cx="50" cy="73" r="7" fill="#a2d149"/>
            </svg></span>
            <span id="refresh-timer" class="timer-display" aria-hidden="true"></span>
        </button>
    </div>
    <div id="signjs-health" class="signjs-health" role="status" aria-live="polite">
        <span class="signjs-health-icon" aria-hidden="true">✍</span>
        <span id="signjs-health-message">Загрузка модуля подписи…</span>
        <button id="signjs-retry" type="button" hidden onclick="retrySignJs()">Повторить</button>
    </div>
    <iframe
        id="signjs-widget"
        class="signjs-widget-frame"
        src="cloud-sign.html?mode=embedded"
        title="Обработчик электронной подписи"
        width="72"
        height="72"
        data-compact="true"
        data-health="loading"
    ></iframe>

    <h1>Bucket Browser</h1>
    <details id="api-settings"><summary>Общие настройки API и SignJS</summary>
        <label>URL API <input id="browser-api-url" type="url" size="65"></label>
        <label>API key <input id="browser-api-key" type="password" autocomplete="off"></label>
        <button onclick="saveBrowserAPI()">Сохранить и подключить</button>
        <p>URL и ключ сохраняются в этом браузере и используются также модулем SignJS.</p>
    </details>

    <div class="upload-section">
        <h3>Upload File</h3>
        <input type="file" id="file-input">
        <button id="upload-btn" onclick="uploadFile()">Upload</button>
        <div id="upload-status"></div>
    </div>

    <div class="filter-section" id="filter-section">
        <div class="filter-header">
            <h3>Filters</h3>
            <button onclick="clearFilters()" style="font-size: 0.8rem;">Clear All</button>
        </div>
        <div class="filter-controls">
            <input type="text" id="filter-key" placeholder="Tag Key (e.g. status)">
            <input type="text" id="filter-val" placeholder="Tag Value (e.g. error)">
            <button onclick="addManualFilter()">Add Tag Filter</button>
        </div>
        <div class="filter-controls">
            <input type="text" id="filter-name" placeholder="Name Filter (regex)" oninput="updateNameFilter(this.value)">
            <input type="text" id="filter-date" placeholder="Last Modified Filter (regex)" oninput="updateDateFilter(this.value)">
        </div>
        <div id="active-filters"></div>
        <small style="color: #666;">Click on a tag in the table to quickly add a filter.</small>
    </div>

    <div id="breadcrumb" class="breadcrumb"></div>
    <div id="status"></div>

    <table id="file-table" style="display:none;">
        <thead>
            <tr>
                <th class="sortable" onclick="toggleSort('name')">Name <span id="sort-name" class="sort-icon"></span></th>
                <th>Size</th>
                <th class="sortable" onclick="toggleSort('last_modified')">Last Modified <span id="sort-last_modified" class="sort-icon"></span></th>
                <th>Tags</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="file-list"></tbody>
    </table>
    <nav id="pagination" aria-label="Страницы папки">
        <span id="page-label">Страница 1</span>
        <button id="page-prev" onclick="changePage(-1)" disabled>‹ Предыдущая</button>
        <span id="page-numbers"></span>
        <button id="page-next" onclick="changePage(1)" disabled>Следующая ›</button>
    </nav>

    <script src="refresh-controller.js?v=1.3.0"></script>
    <script>
        const API_URL = localStorage.getItem('ymq_gw_url') || '';
        const API_KEY = localStorage.getItem('ymq_api_key') || '';
        const BUCKET = '1bf11148-3595-4a07-a089-d460153b7c7a';
        const PAGE_SIZE = 20;
        let pageNumber = 0;
        let availablePages = 1;
        let capabilitiesPromise = null;
        function ensureAPI() {
            if (!capabilitiesPromise) capabilitiesPromise = apiCall('capabilities').then(data => {
                if (data.apiVersion !== 2 || !data.actions?.includes('get-object-tagging')) throw new Error('Нужен единый API версии 2. Рабочая функция bukupl не поддерживает этот интерфейс.');
            }).catch(error => { capabilitiesPromise = null; throw error; });
            return capabilitiesPromise;
        }
        document.getElementById('browser-api-url').value = API_URL || 'https://d5d6kfk1rvhoeodarkrj.p8361f8z.apigw.yandexcloud.net';
        document.getElementById('browser-api-key').value = API_KEY;
        if (!API_URL || !API_KEY) document.getElementById('api-settings').open = true;
        function saveBrowserAPI() {
            const url = document.getElementById('browser-api-url').value.trim();
            if (!/^https:\/\//i.test(url)) return alert('Укажите HTTPS URL API');
            localStorage.setItem('ymq_gw_url', url);
            localStorage.setItem('ymq_api_key', document.getElementById('browser-api-key').value.trim());
            for (let i = sessionStorage.length - 1; i >= 0; i--) {
                const key = sessionStorage.key(i);
                if (key?.startsWith('bucketBrowser:refresh:')) sessionStorage.removeItem(key);
            }
            location.reload();
        }
        function changePage(step) {
            goToPage(pageNumber + step);
        }
        function goToPage(number) {
            pageNumber = Math.max(0, Math.min(number, availablePages - 1));
            const items = refreshController.cached(getCurrentFolder());
            if (items) renderItems(items, getCurrentFolder());
        }
        function renderPagination(count, loading = false) {
            availablePages = Math.max(1, count);
            const container = document.getElementById('page-numbers');
            container.innerHTML = '';
            const start = Math.max(0, Math.min(pageNumber - 4, availablePages - 10));
            const end = Math.min(availablePages - 1, start + 9);
            const numbers = [...new Set([0, ...Array.from({ length: end - start + 1 }, (_, i) => start + i), availablePages - 1])].sort((a, b) => a - b);
            let previous = -1;
            for (const number of numbers) {
                if (number > previous + 1) {
                    const dots = document.createElement('span');
                    dots.textContent = '…';
                    container.appendChild(dots);
                }
                const button = document.createElement('button');
                button.type = 'button';
                button.textContent = String(number + 1);
                button.setAttribute('aria-label', `Страница ${number + 1}`);
                if (number === pageNumber) button.setAttribute('aria-current', 'page');
                button.disabled = loading || number === pageNumber;
                button.onclick = () => goToPage(number);
                container.appendChild(button);
                previous = number;
            }
            document.getElementById('page-prev').disabled = loading || pageNumber === 0;
            document.getElementById('page-next').disabled = loading || pageNumber >= availablePages - 1;
        }
        const SIGNJS_LAYOUT_MESSAGE = 'signjs:layout';
        let allowedTags = ['error', 'finished'];
        let hiddenFolderRegex = /^[_.]/;
        let activeFilters = {}; // { key: [values] }
        let nameFilter = '';
        let dateFilter = '';
        let sortConfig = { key: null, order: null }; // order: 'asc', 'desc', null
        let signJsLayout = { compact: true, width: 72, height: 72 };
        let listViewVersion = 0;
        const listErrors = new Map();
        let renderGeneration = 0;
        let tagAbort = null;
        const visibleRows = new Map();
        let tagsLoadingFolder = null;
        let signJsWatchdog;
        let signJsReady = false;
        function logDiagnostic(message) {
            console.warn(message);
        }
        function signJsFailed(reason) {
            clearTimeout(signJsWatchdog);
            signJsReady = false;
            document.getElementById('signjs-widget').dataset.health = 'error';
            document.getElementById('signjs-health').hidden = false;
            document.getElementById('signjs-health-message').textContent = 'Модуль подписи не загрузился';
            document.getElementById('signjs-retry').hidden = false;
            logDiagnostic(`SignJS: ${reason}. Проверьте наличие cloud-sign.html, CloudSignApp.js, style.css и cadesplugin_api.js рядом с index.html.`);
        }
        function watchSignJs() {
            clearTimeout(signJsWatchdog);
            signJsReady = false;
            document.getElementById('signjs-widget').dataset.health = 'loading';
            document.getElementById('signjs-health').hidden = false;
            document.getElementById('signjs-health-message').textContent = 'Загрузка модуля подписи…';
            document.getElementById('signjs-retry').hidden = true;
            signJsWatchdog = setTimeout(() => {
                if (!signJsReady) signJsFailed('нет сообщения готовности в течение 12 секунд');
            }, 12000);
        }
        function retrySignJs() {
            watchSignJs();
            document.getElementById('signjs-widget').src = `cloud-sign.html?mode=embedded&retry=${Date.now()}`;
        }
        document.getElementById('signjs-widget').onerror = () => signJsFailed('ошибка загрузки iframe');
        watchSignJs();
        async function apiCall(action, params = {}, signal) {
            if (!API_URL || !API_KEY) throw new Error('Укажите общий URL API и ключ в настройках');
            const controller = new AbortController();
            const abort = () => controller.abort();
            signal?.addEventListener('abort', abort, { once: true });
            if (signal?.aborted) controller.abort();
            const timeout = setTimeout(abort, 30000);
            try {
                const response = await fetch(API_URL, { method: 'POST', signal: controller.signal,
                    headers: { 'Content-Type': 'application/json', 'X-Api-Key': API_KEY },
                    body: JSON.stringify({ action, params }) });
                const data = await response.json();
                if (!response.ok) throw Object.assign(new Error(data.error || `HTTP error! status: ${response.status}`), { status: response.status });
                return data;
            } finally {
                clearTimeout(timeout);
                signal?.removeEventListener('abort', abort);
            }
        }
        const refreshController = new FolderRefreshController({
            scope: `v2:${location.pathname}:${API_URL}:${BUCKET}`,
            storage: { getItem: key => localStorage.getItem(key), setItem: (key, value) => localStorage.setItem(key, value) },
            cacheStorage: {
                getItem: key => sessionStorage.getItem(key), setItem: (key, value) => sessionStorage.setItem(key, value),
                removeItem: key => sessionStorage.removeItem(key)
            },
            onChange: updateRefreshButtonUI,
            fetchItems: async folder => {
                const items = [];
                let cursor = '';
                do {
                    const page = await apiCall('list-objects-v2', { Bucket: BUCKET, Prefix: folder,
                        Delimiter: '/', MaxKeys: 500, ...(cursor ? { ContinuationToken: cursor } : {}) });
                    if (!Array.isArray(page.Contents) && !Array.isArray(page.CommonPrefixes) && page.KeyCount !== 0) throw new Error('API не поддерживает постраничный список');
                    items.push(...(page.CommonPrefixes || []).map(p => ({ name: p.Prefix, type: 'folder' })),
                        ...(page.Contents || []).filter(o => o.Key !== folder).map(o => ({ name: o.Key,
                            type: 'file', size: o.Size, last_modified: o.LastModified })));
                    if (page.IsTruncated && (!page.NextContinuationToken || page.NextContinuationToken === cursor)) throw new Error('Invalid pagination cursor');
                    cursor = page.IsTruncated ? page.NextContinuationToken : '';
                } while (cursor);
                return items;
            }
        });

        function updateRefreshButtonUI() {
            const folder = getCurrentFolder();
            const { loading: listing, remaining } = refreshController.state(folder);
            const loading = listing || tagsLoadingFolder === folder;
            const button = document.getElementById('refresh-btn');
            button.disabled = loading || remaining > 0;
            button.dataset.state = loading ? 'loading' : listErrors.has(folder) ? 'error' : remaining > 0 ? 'cooldown' : 'ready';
            document.getElementById('refresh-timer').textContent = loading ? '…' : remaining > 0 ? remaining : '';
            const label = loading ? 'Обновление списка файлов' : listErrors.has(folder) ? 'Ошибка загрузки. Повторить обновление' :
                remaining > 0 ? `Обновление доступно через ${remaining} сек.` : 'Обновить список файлов';
            button.title = label;
            button.setAttribute('aria-label', label);
            button.setAttribute('aria-busy', String(loading));
        }

        function manualRefresh() { return fetchItems({ manual: true }); }
        function renderCurrentItems() {
            pageNumber = 0;
            const items = refreshController.cached(getCurrentFolder());
            if (items) renderItems(items, getCurrentFolder());
        }
        async function refreshAfterMutation(folder) {
            // An older list request may have started before this successful change.
            const pending = refreshController.pending.get(folder);
            if (pending) await pending.catch(() => {});
            refreshController.invalidate(folder);
            if (getCurrentFolder() === folder) return fetchItems({ force: true });
        }
        setInterval(updateRefreshButtonUI, 1000);
        window.addEventListener('storage', updateRefreshButtonUI);
        window.addEventListener('storage', event => {
            if (['ymq_gw_url', 'ymq_api_key'].includes(event.key)) location.reload();
        });

        function applySignJsLayout() {
            const frame = document.getElementById('signjs-widget');
            const viewportPadding = 32;
            const maxWidth = Math.max(72, window.innerWidth - viewportPadding);
            const maxHeight = Math.max(72, window.innerHeight - viewportPadding);
            frame.style.width = `${Math.min(signJsLayout.width, maxWidth)}px`;
            frame.style.height = `${Math.min(signJsLayout.height, maxHeight)}px`;
            frame.dataset.compact = String(signJsLayout.compact);
        }

        window.addEventListener('message', event => {
            const frame = document.getElementById('signjs-widget');
            if (event.origin !== window.location.origin) return;
            if (event.source !== frame.contentWindow) return;
            if (event.data?.type !== SIGNJS_LAYOUT_MESSAGE) return;

            clearTimeout(signJsWatchdog);
            signJsReady = true;
            frame.dataset.health = 'ready';
            document.getElementById('signjs-health').hidden = true;

            const compact = event.data.compact === true;
            signJsLayout = {
                compact,
                width: compact ? 72 : 760,
                height: compact ? 72 : 900
            };
            applySignJsLayout();
        });
        window.addEventListener('resize', applySignJsLayout);

        let configLoaded = false;
        async function fetchConfig() {
            if (configLoaded) return;
            try {
                const data = await apiCall('get-download-url', { Bucket: BUCKET, Key: 'config/UI-conf.json' });
                if (data.url) {
                    const configResponse = await fetch(data.url);
                    if (configResponse.ok) {
                        const configData = await configResponse.json();
                        if (configData && Array.isArray(configData.allowed_delete_tags)) {
                            allowedTags = configData.allowed_delete_tags;
                        }
                        if (typeof configData?.hidden_folder_regex === 'string') {
                            try {
                                hiddenFolderRegex = configData.hidden_folder_regex ? new RegExp(configData.hidden_folder_regex) : null;
                            } catch (_) {
                                console.warn('UI-conf.json: некорректный hidden_folder_regex; используется ^[_.]');
                            }
                        }
                        configLoaded = true;
                    }
                }
            } catch (e) {
                console.error("Failed to fetch UI-conf.json, using defaults", e);
            }
        }

        function loadSettings() {
            const folder = getCurrentFolder();

            // Load Tags Filters
            const savedFilters = localStorage.getItem(`filters_${folder}`);
            if (savedFilters) {
                try { activeFilters = JSON.parse(savedFilters); } catch (e) { activeFilters = {}; }
            } else { activeFilters = {}; }

            // Load Name/Date Filters
            nameFilter = localStorage.getItem(`nameFilter_${folder}`) || '';
            dateFilter = localStorage.getItem(`dateFilter_${folder}`) || '';
            document.getElementById('filter-name').value = nameFilter;
            document.getElementById('filter-date').value = dateFilter;

            // Load Sort
            const savedSort = localStorage.getItem(`sort_${folder}`);
            if (savedSort) {
                try { sortConfig = JSON.parse(savedSort); } catch (e) { sortConfig = { key: null, order: null }; }
            } else { sortConfig = { key: null, order: null }; }

            updateFilterUI();
            updateSortUI();
        }

        function saveSettings() {
            const folder = getCurrentFolder();
            localStorage.setItem(`filters_${folder}`, JSON.stringify(activeFilters));
            localStorage.setItem(`nameFilter_${folder}`, nameFilter);
            localStorage.setItem(`dateFilter_${folder}`, dateFilter);
            localStorage.setItem(`sort_${folder}`, JSON.stringify(sortConfig));
            updateFilterUI();
            updateSortUI();
        }

        function updateNameFilter(val) {
            nameFilter = val;
            saveSettings();
            renderCurrentItems();
        }

        function updateDateFilter(val) {
            dateFilter = val;
            saveSettings();
            renderCurrentItems();
        }

        function toggleSort(key) {
            if (sortConfig.key === key) {
                if (sortConfig.order === 'asc') sortConfig.order = 'desc';
                else if (sortConfig.order === 'desc') {
                    sortConfig.order = null;
                    sortConfig.key = null;
                }
            } else {
                sortConfig.key = key;
                sortConfig.order = 'asc';
            }
            saveSettings();
            renderCurrentItems();
        }

        function updateSortUI() {
            const sortName = document.getElementById('sort-name');
            const sortDate = document.getElementById('sort-last_modified');
            if (sortName) sortName.textContent = '';
            if (sortDate) sortDate.textContent = '';
            if (sortConfig.key) {
                const icon = sortConfig.order === 'asc' ? '↑' : '↓';
                const el = document.getElementById(`sort-${sortConfig.key}`);
                if (el) el.textContent = icon;
            }
        }

        function addManualFilter() {
            const key = document.getElementById('filter-key').value.trim();
            const val = document.getElementById('filter-val').value.trim();
            if (key && val) {
                addFilter(key, val);
                document.getElementById('filter-key').value = '';
                document.getElementById('filter-val').value = '';
            } else {
                alert('Both Tag Key and Tag Value are required.');
            }
        }

        function updateFilterUI() {
            const container = document.getElementById('active-filters');
            container.innerHTML = '';

            const keys = Object.keys(activeFilters);
            if (keys.length === 0) {
                container.innerHTML = '<p style="color: #666; font-style: italic;">No active filters.</p>';
                return;
            }

            keys.forEach(key => {
                activeFilters[key].forEach(val => {
                    const chip = document.createElement('div');
                    chip.className = 'filter-chip';
                    chip.textContent = `${key}: ${val}`;

                    const btn = document.createElement('button');
                    btn.className = 'remove-filter-btn';
                    btn.innerHTML = '&times;';
                    btn.onclick = () => removeFilter(key, val);

                    chip.appendChild(btn);
                    container.appendChild(chip);
                });
            });
        }

        function addFilter(key, value) {
            if (!activeFilters[key]) activeFilters[key] = [];
            if (!activeFilters[key].includes(value)) {
                activeFilters[key].push(value);
                saveSettings();
                renderCurrentItems();
            }
        }

        function removeFilter(key, value) {
            if (activeFilters[key]) {
                activeFilters[key] = activeFilters[key].filter(v => v !== value);
                if (activeFilters[key].length === 0) delete activeFilters[key];
                saveSettings();
                renderCurrentItems();
            }
        }

        function clearFilters() {
            activeFilters = {};
            nameFilter = '';
            dateFilter = '';
            document.getElementById('filter-name').value = '';
            document.getElementById('filter-date').value = '';
            saveSettings();
            renderCurrentItems();
        }

        // Get folder from URL hash
        function getCurrentFolder() {
            const hash = window.location.hash.substring(1); // remove '#'
            const params = new URLSearchParams(hash);
            return params.get('folder') || '';
        }

        function updateBreadcrumb(folder) {
            const breadcrumb = document.getElementById('breadcrumb');
            let html = '<a href="#">Root</a>';

            if (folder) {
                const parts = folder.split('/').filter(p => p);
                let path = '';
                parts.forEach((part, index) => {
                    path += part + '/';
                    const safePart = part.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
                    html += ` / <a href="#folder=${encodeURIComponent(path)}">${safePart}</a>`;
                });
            }
            breadcrumb.innerHTML = html;
        }

        async function fetchItems(options = {}) {
            pageNumber = 0;
            tagAbort?.abort();
            tagsLoadingFolder = null;
            ++renderGeneration;
            const currentFolder = getCurrentFolder();
            const viewVersion = ++listViewVersion;
            updateBreadcrumb(currentFolder);
            loadSettings();
            const statusDiv = document.getElementById('status');
            const table = document.getElementById('file-table');
            listErrors.delete(currentFolder);
            statusDiv.className = 'loading';
            statusDiv.textContent = 'Loading items...';
            if (!refreshController.cached(currentFolder)) table.style.display = 'none';
            try {
                await ensureAPI();
                await fetchConfig();
                const items = await refreshController.load(currentFolder, options);
                if (viewVersion !== listViewVersion || currentFolder !== getCurrentFolder()) return;
                if (items) renderItems(items, currentFolder);
                else statusDiv.textContent = '';
            } catch (error) {
                listErrors.set(currentFolder, error.message);
                if (viewVersion !== listViewVersion || currentFolder !== getCurrentFolder()) return;
                statusDiv.className = 'error';
                statusDiv.textContent = `Error loading items: ${error.message}`;
            } finally { updateRefreshButtonUI(); }
        }

        function renderItems(sourceItems, currentFolder, targetRow = null) {
            const statusDiv = document.getElementById('status');
            const table = document.getElementById('file-table');
            const tbody = document.getElementById('file-list');
            let items = sourceItems.filter(item => item.type !== 'folder' || !hiddenFolderRegex ||
                !hiddenFolderRegex.test(item.name.slice(currentFolder.length).split('/')[0]));
            const visibleTotal = items.length;
                // Apply Tag Filters
                const filterKeys = Object.keys(activeFilters);
                if (targetRow && filterKeys.length > 0) {
                    items = items.filter(item => {
                        if (item.type !== 'file') return true;
                        if (!item.tags) return false;

                        return filterKeys.every(fk => {
                            const itemTagValue = item.tags[fk];
                            if (!itemTagValue) return false;
                            return activeFilters[fk].includes(itemTagValue);
                        });
                    });
                }

                // Apply Name Filter (Regex)
                if (nameFilter) {
                    try {
                        const regex = new RegExp(nameFilter, 'i');
                        items = items.filter(item => {
                            if (item.type !== 'file') return true;
                            const relativeName = item.name.replace(currentFolder, '');
                            return regex.test(relativeName);
                        });
                    } catch (e) {
                        console.error("Invalid Name Regex", e);
                    }
                }

                // Apply Date Filter (Regex)
                if (dateFilter) {
                    try {
                        const regex = new RegExp(dateFilter, 'i');
                        items = items.filter(item => {
                            if (item.type !== 'file') return true;
                            const dateStr = new Date(item.last_modified).toLocaleString();
                            return regex.test(dateStr);
                        });
                    } catch (e) {
                        console.error("Invalid Date Regex", e);
                    }
                }

                // Apply Sorting
                if (sortConfig.key && sortConfig.order) {
                    items.sort((a, b) => {
                        // Keep folders always at the top, or maybe just sort files?
                        // Usually folders and files are sorted separately or together.
                        // Let's sort them together but we can decide.
                        if (a.type === 'folder' && b.type !== 'folder') return -1;
                        if (a.type !== 'folder' && b.type === 'folder') return 1;

                        let valA = a[sortConfig.key];
                        let valB = b[sortConfig.key];

                        if (sortConfig.key === 'name') {
                            valA = valA.toLowerCase();
                            valB = valB.toLowerCase();
                        }

                        if (valA < valB) return sortConfig.order === 'asc' ? -1 : 1;
                        if (valA > valB) return sortConfig.order === 'asc' ? 1 : -1;
                        return 0;
                    });
                }

                if (!targetRow) {
                    tagAbort?.abort();
                    tagsLoadingFolder = null;
                    tagAbort = new AbortController();
                    ++renderGeneration;
                    visibleRows.clear();
                    tbody.innerHTML = '';
                    document.getElementById('page-label').textContent = `Всего объектов: ${visibleTotal} · Страница ${pageNumber + 1}`;
                    renderPagination(Object.keys(activeFilters).length ? pageNumber + 1 : Math.ceil(items.length / PAGE_SIZE), items.length > 0);
                } else if (!items.length) {
                    targetRow.style.display = 'none';
                    return;
                }

                // Handle Parent directory if not in root
                if (currentFolder && !targetRow) {
                    const parentFolder = currentFolder.split('/').filter(p => p).slice(0, -1).join('/') + (currentFolder.includes('/') && currentFolder.split('/').filter(p => p).length > 1 ? '/' : '');
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td colspan="5">
                            <a class="folder-link" href="#folder=${encodeURIComponent(parentFolder)}">
                                <span class="icon">📁</span>.. (Parent Directory)
                            </a>
                        </td>
                    `;
                    tbody.appendChild(row);
                }

                if (items.length === 0 && !currentFolder) {
                    statusDiv.className = '';
                    statusDiv.textContent = '';
                    table.style.display = 'none';
                    return;
                }

                items.forEach(item => {
                    const row = targetRow || document.createElement('tr');
                    row.innerHTML = '';
                    row.style.display = '';
                    visibleRows.set(item.name, row);
                    if (!targetRow && item.type === 'file') {
                        row.style.display = 'none';
                        tbody.appendChild(row);
                        return;
                    }

                    const nameCell = document.createElement('td');
                    if (item.type === 'folder') {
                        const link = document.createElement('a');
                        link.className = 'folder-link';
                        link.href = `#folder=${encodeURIComponent(item.name)}`;
                        link.textContent = `📁${item.name.replace(currentFolder, '')}`;
                        nameCell.appendChild(link);
                    } else {
                        const link = document.createElement('a');
                        link.textContent = `📄${item.name.replace(currentFolder, '')}`;
                        if (/\.(json|txt|bmp|png|jpe?g)$/i.test(item.name)) {
                            link.href = '#';
                            link.onclick = event => { event.preventDefault(); previewFile(item.name); };
                            link.rel = 'noopener noreferrer';
                            link.title = 'Просмотреть содержимое';
                        }
                        nameCell.appendChild(link);
                    }

                    const sizeCell = document.createElement('td');
                    sizeCell.className = 'size';
                    sizeCell.textContent = item.type === 'file' ? formatBytes(item.size) : '-';

                    const dateCell = document.createElement('td');
                    dateCell.textContent = item.type === 'file' ? new Date(item.last_modified).toLocaleString() : '-';

                    const tagsCell = document.createElement('td');
                    if (item.type === 'file' && item.tags) {
                        Object.entries(item.tags).forEach(([key, value]) => {
                            const tagSpan = document.createElement('span');
                            tagSpan.className = 'tag clickable-tag';
                            tagSpan.textContent = `${key}: ${value}`;
                            tagSpan.onclick = () => addFilter(key, value);

                            const k = String(key).trim().toLowerCase();
                            const v = String(value).trim().toLowerCase();
                            const isAllowed = allowedTags.some(t => {
                                const s = String(t).trim().toLowerCase();
                                return s === k || s === v;
                            });

                            const removeBtn = document.createElement('button');
                            removeBtn.className = 'remove-tag-btn';
                            removeBtn.innerHTML = '&times;';

                            if (isAllowed) {
                                removeBtn.title = `Remove tag ${key}`;
                                removeBtn.onclick = (e) => {
                                    e.stopPropagation();
                                    removeTag(item.name, key);
                                };
                            } else {
                                removeBtn.disabled = true;
                                removeBtn.title = `Tag "${key}" cannot be removed by configuration`;
                                removeBtn.onclick = (e) => e.stopPropagation();
                            }
                            tagSpan.appendChild(removeBtn);
                            tagsCell.appendChild(tagSpan);
                        });
                    } else {
                        tagsCell.textContent = '-';
                    }

                    const actionCell = document.createElement('td');
                    if (item.type === 'file') {
                        const btn = document.createElement('button');
                        btn.className = 'download-btn';
                        btn.innerHTML = '📥';
                        btn.title = 'Download';
                        btn.onclick = () => downloadFile(item.name);
                        actionCell.appendChild(btn);

                        const setTagBtn = document.createElement('button');
                        setTagBtn.className = 'set-tag-btn';
                        setTagBtn.textContent = '+ Tag';
                        setTagBtn.onclick = () => promptSetTag(item.name);
                        actionCell.appendChild(setTagBtn);
                    }

                    row.appendChild(nameCell);
                    row.appendChild(sizeCell);
                    row.appendChild(dateCell);
                    row.appendChild(tagsCell);
                    row.appendChild(actionCell);
                    if (!targetRow) {
                        tbody.appendChild(row);
                        row.style.display = 'none';
                    }
                });

                if (targetRow) return;
                statusDiv.textContent = '';
                statusDiv.className = '';
                table.style.display = 'table';
                hydrateRows(items, currentFolder, renderGeneration, tagAbort.signal);
        }

        async function hydrateRows(items, folder, generation, signal) {
            tagsLoadingFolder = folder;
            updateRefreshButtonUI();
            let completed = 0, errors = 0, matched = 0, shown = 0;
            const start = pageNumber * PAGE_SIZE;
            const hasTagFilters = Object.keys(activeFilters).length > 0;
            for (const item of items) {
                if (generation !== renderGeneration || signal.aborted) return;
                // Metadata already determines the page when there are no tag filters.
                if (!hasTagFilters && completed < start) { completed++; matched++; continue; }
                const revision = item.tagRevision || 0;
                try {
                    if (item.type === 'file' && !item.tags) {
                        const data = await apiCall('get-object-tagging', { Bucket: BUCKET, Key: item.name }, signal);
                        if (!Array.isArray(data.TagSet)) throw new Error('Invalid tags response');
                        if (generation !== renderGeneration || signal.aborted) return;
                        if ((item.tagRevision || 0) === revision) item.tags = Object.fromEntries(data.TagSet.map(t => [t.Key, t.Value]));
                    }
                    const matches = item.type === 'folder' || Object.keys(activeFilters).every(k => activeFilters[k].includes(item.tags?.[k]));
                    if (matches && matched++ >= start) {
                        renderItems([item], folder, visibleRows.get(item.name));
                        shown++;
                    }
                } catch (error) {
                    if (generation !== renderGeneration || signal.aborted) return;
                    if ((item.tagRevision || 0) === revision) {
                        errors++;
                        if (matched++ >= start) { showTagError(folder, item.name); shown++; }
                    }
                    if ([401, 403].includes(error.status)) {
                        logDiagnostic('Чтение тегов остановлено: API отказал в доступе. Проверьте ключ и разрешения.');
                        completed = items.length;
                        break;
                    }
                }
                completed++;
                if (shown >= PAGE_SIZE) break;
            }
            refreshController.persist(folder);
            if (generation === renderGeneration) {
                tagsLoadingFolder = null;
                renderPagination(hasTagFilters ? pageNumber + 1 + (completed < items.length ? 1 : 0) : Math.ceil(items.length / PAGE_SIZE));
                updateRefreshButtonUI();
            }
        }

        function showTagError(folder, filename) {
            const row = visibleRows.get(filename);
            if (getCurrentFolder() !== folder || !row) return;
            row.innerHTML = '';
            const cell = document.createElement('td');
            cell.colSpan = 5;
            cell.textContent = `${filename}: теги не загружены, фильтр по тегам не проверен. `;
            const retry = document.createElement('button');
            retry.textContent = 'Повторить';
            retry.onclick = () => {
                retry.disabled = true;
                refreshObjectTags(folder, filename).catch(() => {});
            };
            cell.appendChild(retry);
            row.appendChild(cell);
            row.style.display = '';
        }

        async function refreshObjectTags(folder, filename) {
            const item = refreshController.cached(folder)?.find(item => item.name === filename);
            if (!item) return;
            const revision = (item.tagRevision || 0) + 1;
            item.tagRevision = revision;
            delete item.tags;
            refreshController.persist(folder);
            try {
                const data = await apiCall('get-object-tagging', { Bucket: BUCKET, Key: filename });
                if (!Array.isArray(data.TagSet)) throw new Error('Invalid tags response');
                if (item.tagRevision !== revision || !refreshController.cached(folder)?.includes(item)) return;
                item.tags = Object.fromEntries(data.TagSet.map(t => [t.Key, t.Value]));
                refreshController.persist(folder);
                const row = visibleRows.get(filename);
                if (getCurrentFolder() === folder && row) renderItems([item], folder, row);
            } catch (error) {
                if (item.tagRevision === revision) showTagError(folder, filename);
                throw error;
            }
        }

        function applyTagResult(folder, filename, result) {
            const item = refreshController.cached(folder)?.find(i => i.name === filename);
            if (!item) return;
            item.tagRevision = (item.tagRevision || 0) + 1;
            item.tags = Object.fromEntries(result.TagSet.map(t => [t.Key, t.Value]));
            refreshController.persist(folder);
            const row = visibleRows.get(filename);
            if (getCurrentFolder() === folder && row) renderItems([item], folder, row);
        }
        async function previewFile(filename) {
            const tab = window.open('about:blank', '_blank');
            if (!tab) return alert('Разрешите открытие новой вкладки для просмотра');
            tab.opener = null;
            try {
                const result = await apiCall('get-preview-url', { Bucket: BUCKET, Key: filename });
                tab.location.href = result.url;
            } catch (error) { tab.close(); alert(error.message); }
        }

        async function downloadFile(filename) {
            const folderAtDownload = getCurrentFolder();
            try {
                const data = await apiCall('get-download-url', { Bucket: BUCKET, Key: filename });
                if (!data.url) throw new Error('API не вернул ссылку на скачивание');
                window.location.href = data.url;
            } catch (error) {
                console.error('Download error:', error);
                alert(`Не удалось начать скачивание: ${error.message}`);
                return;
            }
            // The browser starts downloading independently; a tag failure is not a download failure.
            try {
                const result = await apiCall('set-object-tag', { Bucket: BUCKET, Key: filename, TagKey: 'downloadStatus', TagValue: 'downloaded' });
                if (!result.success) throw new Error(result.error || 'API не подтвердил сохранение тега');
                applyTagResult(folderAtDownload, filename, result);
            } catch (error) {
                console.warn('Скачивание запущено, но тег downloadStatus не сохранён:', error);
                alert(`Скачивание запущено, но отметка downloadStatus не сохранена: ${error.message}`);
            }
        }

        async function removeTag(filename, tagKey) {
            const folderAtChange = getCurrentFolder();
            if (!confirm(`Are you sure you want to remove tag "${tagKey}" from ${filename}?`)) return;

            try {
                const result = await apiCall('remove-object-tag', { Bucket: BUCKET, Key: filename, TagKey: tagKey });
                if (result.success) {
                    applyTagResult(folderAtChange, filename, result);
                } else {
                    alert('Failed to remove tag: ' + result.error);
                }
            } catch (error) {
                console.error('Remove tag error:', error);
                alert(`Error removing tag: ${error.message}`);
            }
        }

        async function promptSetTag(filename) {
            const folderAtChange = getCurrentFolder();
            const tagKey = prompt("Enter tag key (e.g. status):");
            if (!tagKey) return;
            const tagValue = prompt(`Enter tag value for "${tagKey}":`);
            if (tagValue === null) return;

            try {
                const result = await apiCall('set-object-tag', { Bucket: BUCKET, Key: filename, TagKey: tagKey, TagValue: tagValue });
                if (result.success) {
                    applyTagResult(folderAtChange, filename, result);
                } else {
                    alert('Failed to set tag: ' + result.error);
                }
            } catch (error) {
                console.error('Set tag error:', error);
                alert(`Error setting tag: ${error.message}`);
            }
        }

        async function uploadFile() {
            const fileInput = document.getElementById('file-input');
            const statusDiv = document.getElementById('upload-status');
            const uploadBtn = document.getElementById('upload-btn');

            if (!fileInput.files.length) {
                alert('Please select a file.');
                return;
            }

            const file = fileInput.files[0];
            const currentFolder = getCurrentFolder();

            statusDiv.textContent = 'Getting upload URL...';
            uploadBtn.disabled = true;

            try {
                const { url: upload_url } = await apiCall('get-upload-url', { Bucket: BUCKET, Key: currentFolder + file.name });

                statusDiv.textContent = 'Uploading...';
                const uploadResponse = await fetch(upload_url, {
                    method: 'PUT',
                    body: file,
                    headers: {
                        'If-None-Match': '*'
                    }
                });

                if (uploadResponse.status === 412) {
                    statusDiv.textContent = 'Error: File already exists (Precondition Failed).';
                    statusDiv.style.color = 'red';
                } else if (!uploadResponse.ok) {
                    throw new Error(`Upload failed with status: ${uploadResponse.status}`);
                } else {
                    statusDiv.textContent = 'Upload successful!';
                    statusDiv.style.color = 'green';
                    fileInput.value = '';
                    await refreshAfterMutation(currentFolder);
                }
            } catch (error) {
                console.error('Upload error:', error);
                statusDiv.textContent = `Error: ${error.message}`;
                statusDiv.style.color = 'red';
            } finally {
                uploadBtn.disabled = false;
            }
        }

        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        window.onhashchange = () => fetchItems();
        fetchItems();
    </script>
</body>
